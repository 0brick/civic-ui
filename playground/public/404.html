<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Civic UI</title>
    <script>
      // SPA fallback for static hosting: encodes the requested path into
      // index.html's query string; index.html restores it before boot.
      var l = window.location
      l.replace(l.protocol + '//' + l.host + '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash)
    </script>
  </head>
  <body></body>
</html>
