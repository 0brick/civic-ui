name: CI

# No run on push to main: the ruleset only merges up-to-date PRs with green
# checks, so main gets exactly what the PR run tested.
# Weekly run on main: catches runner/Chrome updates, keeps badge and cache.
on:
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# New push to a PR cancels the old run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Skip `prepare` (build:lib runs below) and dependency install scripts.
      - run: npm ci --ignore-scripts
      # Same result on every Node version, run once.
      - if: matrix.node == 22
        run: npm run lint
      - run: npm test
      - run: npm run build:lib
      - if: matrix.node == 22
        run: npm run docs:index -- --check

  a11y-e2e:
    name: Accessibility and privacy (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:a11y-e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
