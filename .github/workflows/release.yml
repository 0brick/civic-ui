name: Release

# Runs on a version tag (`npm run release -- tag`): npm, GitHub release, Pages.
# Publishes via npm trusted publishing (OIDC), no token needed.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/civic-ui/v/${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed for the check against main.
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        name: Check tag, version and branch
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # Only commits on main have passed the PR checks.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm >= 11.5.1 (comes with Node 24).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      # Already tested in the PR, but a version can't be republished.
      - run: npm test
      # `prepare` builds dist/.
      - run: npm publish --provenance --tag ${{ steps.meta.outputs.prerelease == 'true' && 'next' || 'latest' }}

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          args=(--verify-tag --title "Version $VERSION")
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"

  pages:
    name: Playground
    needs: publish
    if: needs.publish.outputs.prerelease == 'false'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
